[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testcase-gen"
version = "1.0.0"
description = "AI 测试工程平台 - 基于 LLM 的自动化测试工程平台"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1.0",
    "rich>=13.0.0",
    "json5>=0.9.0",
    "flask>=3.0.0",
    "werkzeug>=3.0.0",
    "cryptography>=41.0.0",
    "gunicorn>=21.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff~=0.16.7",
]

[tool.setuptools]
# 显式声明包，禁用 flat-layout 自动发现（根目录含 data/output/static 等非包目录）
packages = ["core", "web"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["docs"]  # 设计文档内的代码片段为示意，不做 lint/format

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # 行长度限制由 formatter 处理
    "E741",   # 允许 l/o 等变量名
    "SIM108", # 允许 if-else 而非三元表达式（可读性优先）
    "SIM115", # 允许 open() 而非 context manager（某些场景）
    "B008",   # 允许函数默认参数中的函数调用（Flask 路由参数）
]

[tool.ruff.lint.isort]
known-first-party = ["core", "web"]

[tool.ruff.lint.per-file-ignores]
# Blueprint 导入必须在 app 创建之后注册（Flask 标准写法），非无意放置
"web/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
