services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: testcase-gen:latest
    container_name: testcase-gen
    ports:
      # 只绑宿主机回环：公网实例必须由 Nginx/Caddy 终结 TLS 后反代过来。
      # 直接暴露 5000 会让 get_real_ip() 无条件信任的 X-Forwarded-For 可被伪造（限流失效），且没有 HTTPS。
      - "127.0.0.1:5000:5000"
    volumes:
      # 先 cp config.yaml.example config.yaml 再 up；文件缺失时 Docker 会把它自动建成空目录
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    # gunicorn graceful_timeout=30，给在途 SSE 流留完胜机会
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
