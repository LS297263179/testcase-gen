services:
  app:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PIP_EXTRA: ${PIP_EXTRA:-}
    image: testcase-gen:latest
    container_name: testcase-gen
    ports:
      # 默认只绑宿主机回环：公网实例应由反向代理终结 TLS 后转过来。
      # 没有反代、要让容器直接对公网提供服务时，在 .env 里设 PUBLISH_ADDR=0.0.0.0 + HTTP_PORT=80。
      # 注意 gunicorn 不做 TLS，开 443 必须先有反代或证书方案。
      - "${PUBLISH_ADDR:-127.0.0.1}:${HTTP_PORT:-5000}:5000"
    volumes:
      # 先 cp config.yaml.example config.yaml 再 up；文件缺失时 Docker 会把它自动建成空目录
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./output:/app/output
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped
    # gunicorn graceful_timeout=30，给在途 SSE 流留完胜机会
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
